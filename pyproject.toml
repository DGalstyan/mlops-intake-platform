[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intake-platform"
version = "0.1.0"
description = "Document-intake MLOps platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# `pythonpath = ["."]` rather than an installed package: the SageMaker training
# job runs these modules as scripts from a copied source_dir, not from a wheel,
# so imports have to work from the repo root. Keeping the test path resolution
# identical to the runtime one means a test cannot pass against an import layout
# the training job does not have.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    # Fail on unexpected warnings; scikit-learn's convergence and deprecation
    # warnings are exactly the signal we want surfaced rather than scrolled past.
    "error",
    # cv=3 isotonic calibration on a small per-class sample legitimately warns.
    "ignore::UserWarning:sklearn.calibration",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
# scikit-learn, joblib and scipy ship no type information. Silencing per-import
# rather than globally disabling untyped-import errors, so a *new* untyped
# dependency shows up as an error instead of being absorbed silently.
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "scipy.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Deliberately narrow. A linter that flags 400 stylistic nits on first run gets
# `--fix`-ed blindly or switched off; these are the rules that catch actual defects.
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: undefined names, unused imports, f-strings without placeholders
    "I",   # import sorting
    "B",   # bugbear: mutable defaults, loop-variable binding, except-without-raise
    "UP",  # pyupgrade: syntax that is obsolete on the pinned Python
    "SIM", # obvious simplifications
]
ignore = [
    "E501",  # line length is handled by the formatter's judgement, not a hard fail
    "B008",  # function call in a default arg — intentional for Path defaults
    # `isinstance(x, (int, float))` reads better than `isinstance(x, int | float)`
    # for the numeric-type checks in the validator, and both are correct on 3.12.
    "UP038",
    # Nested `if`s are frequently the clearer form here: the outer condition is a
    # type guard and the inner one is the actual check, and collapsing them with
    # `and` obscures which is which.
    "SIM102",
]

[tool.ruff.lint.per-file-ignores]
# Entrypoints bootstrap sys.path before importing src.*, so their imports cannot be
# at the top of the file. That is a real constraint of running the same module both
# as a script and inside a SageMaker container, not a style lapse.
"src/**/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
