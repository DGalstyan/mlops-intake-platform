name: main

# Deploys to dev on every push to main. Every job here needs AWS, so the whole
# workflow no-ops when no deploy role is configured rather than failing red for a
# reason unrelated to the commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress. Cancelling a deploy mid-apply leaves Terraform state
  # locked and the environment half-changed; queueing is the only safe behaviour
  # for a workflow that mutates infrastructure.
  group: deploy-dev
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.15.8"
  ENVIRONMENT: dev

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.check.outputs.deployable }}
    steps:
      - id: check
        run: |
          if [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_DEPLOY_ROLE_ARN is not set — skipping deploy. Set it as a repository variable after running 'make bootstrap' and 'make apply ENV=dev'."
          fi

  # ---------------------------------------------------------------------------
  # Re-verify before deploying. The PR checks already ran, but main can receive a
  # direct push or a merge whose combination was never tested as a unit.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy
      - run: pytest -q

  # ---------------------------------------------------------------------------
  # Build and push by DIGEST. The digest, not the tag, is what gets registered as
  # model lineage — ECR has immutable tags enabled, so a re-push under an existing
  # tag fails rather than silently changing what a tag points at.
  # ---------------------------------------------------------------------------
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [preflight, verify]
    if: needs.preflight.outputs.deployable == 'true'
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: intake-main-${{ github.run_id }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/inference/Dockerfile
          push: true
          # Immutable, content-addressed tag. Never `latest`.
          tags: ${{ steps.ecr.outputs.registry }}/intake-inference-${{ env.ENVIRONMENT }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the digest
        run: |
          echo "::notice::pushed ${{ steps.ecr.outputs.registry }}/intake-inference-${{ env.ENVIRONMENT }}@${{ steps.push.outputs.digest }}"

  # ---------------------------------------------------------------------------
  # Apply. Deliberately does NOT deploy a model: deploy_endpoint stays whatever the
  # tfvars say, and promoting a model version is a separate, human-approved path.
  # An apply that could also swap the serving model would be a deploy pipeline
  # pretending to be an infrastructure pipeline.
  # ---------------------------------------------------------------------------
  apply:
    name: Terraform apply (dev)
    runs-on: ubuntu-latest
    needs: [preflight, image]
    if: needs.preflight.outputs.deployable == 'true'
    environment: dev   # lets a reviewer require approval on this step in repo settings
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: intake-apply-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - run: make package-lambdas

      - name: Apply
        run: |
          set -o pipefail
          make init ENV=${{ env.ENVIRONMENT }}
          cd infra/envs/${{ env.ENVIRONMENT }}
          terraform apply -var-file=${{ env.ENVIRONMENT }}.tfvars -auto-approve -input=false -no-color \
            | sed -E 's/[0-9]{12}/<ACCOUNT_ID>/g'

      - name: Seed extraction prompts
        # Prompts are data, rendered from schemas/. Re-seeding on every deploy means a
        # schema change reaches production without a code change — which is the point
        # of storing them in DynamoDB rather than in the ASL.
        run: |
          pip install -r requirements-dev.txt
          make seed-prompts ENV=${{ env.ENVIRONMENT }}

  # ---------------------------------------------------------------------------
  # Integration test against the live pipeline. Only meaningful once an endpoint
  # exists, so it degrades to a clear skip rather than a false pass.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration test
    runs-on: ubuntu-latest
    needs: [preflight, apply]
    if: needs.preflight.outputs.deployable == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: intake-integration-${{ github.run_id }}

      - run: pip install -r requirements-dev.txt

      - name: Smoke-test the endpoint
        # The release gate. Non-zero exit here means the deployment is rejected: the
        # response contract broke, confidence is degenerate, or malformed input
        # started returning 5xx (which would make bad requests roll back good
        # deploys).
        run: |
          ENDPOINT="intake-classifier-${{ env.ENVIRONMENT }}"
          if aws sagemaker describe-endpoint --endpoint-name "$ENDPOINT" >/dev/null 2>&1; then
            make smoke-test ENV=${{ env.ENVIRONMENT }}
          else
            echo "::notice::endpoint $ENDPOINT does not exist (deploy_endpoint=false). Skipping the contract test — there is nothing deployed to test."
          fi

  # ---------------------------------------------------------------------------
  # "Promote" is deliberately NOT an automatic deploy to staging.
  # ---------------------------------------------------------------------------
  promote:
    name: Promote
    runs-on: ubuntu-latest
    needs: [preflight, integration]
    if: needs.preflight.outputs.deployable == 'true'
    steps:
      - name: Record the promotable artifact
        # Promotion means "this commit's image passed dev and is eligible for
        # staging". Actually applying to staging stays a manual, human-triggered
        # action for the same reason the registry gate is human: an automatic path
        # from "tests passed" to "another environment changed" removes the last
        # place a person looks at what is about to ship.
        run: |
          echo "::notice::commit ${{ github.sha }} passed dev. To promote: make apply ENV=staging"
